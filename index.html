<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>0524 浴佛法會 義工報到總覽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f7f4ed;
  --white:#fff;
  --ink:#111122;
  --maroon:#801818;
  --green:#0f522e;
  --green-pale:#eaf5ed;
  --green-border:#a3d9b9;
  --red:#b21822;
  --red-pale:#fff2f2;
  --red-border:#ffccd0;
  --gold:#aa7a00;
  --gold-border:#dfbe40;
  --gold-pale:#fbf7ee;
  --amber:#b85c00;
  --gray:#5a4020;
  --border:#ede0cc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--cream);color:var(--ink);
  min-height:100vh;max-width:480px;margin:0 auto;
  box-shadow:0 0 40px rgba(0,0,0,.12);
  line-height:1.6;
}

/* ── HEADER ── */
header{
  background:var(--gold-pale);
  border-bottom:2px solid var(--gold-border);
  padding:1rem 1.1rem .85rem;
  text-align:center;
}
.h-title{
  font-family:'Noto Serif TC',serif;
  font-size:1.25rem;font-weight:900;
  color:var(--maroon);letter-spacing:.04em;line-height:1.4;
}
.h-sub{font-size:.78rem;color:var(--gray);margin-top:.25rem}

/* ── 更新列 ── */
.refresh-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.6rem 1rem;
  background:#faf7f2;border-bottom:1px solid var(--border);
  font-size:.8rem;color:var(--gray);
}
.refresh-time{font-weight:700}
.refresh-btn{
  display:flex;align-items:center;gap:.3rem;
  background:var(--white);border:1.5px solid var(--gold-border);
  color:var(--amber);font-family:inherit;font-size:.8rem;font-weight:700;
  padding:.35rem .75rem;border-radius:8px;cursor:pointer;
  transition:background .15s;
}
.refresh-btn:active{background:var(--gold-pale)}
.spin{display:inline-block;transition:transform .4s}
.spinning .spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 主體 ── */
main{padding:.9rem .85rem 2.5rem}

/* ── 車輛區塊 ── */
.car-block{
  background:var(--white);
  border:2px solid var(--border);
  border-radius:16px;
  margin-bottom:1rem;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(90,64,32,.07);
}
.car-hd{
  display:flex;align-items:center;gap:.55rem;
  padding:.75rem 1rem;
  background:var(--gold-pale);
  border-bottom:1.5px solid var(--gold-border);
}
.car-ic{font-size:1.4rem;line-height:1}
.car-name{
  font-family:'Noto Serif TC',serif;
  font-size:1.05rem;font-weight:900;color:var(--maroon);
}
.car-status{
  margin-left:auto;font-size:.75rem;font-weight:700;
  padding:.2rem .55rem;border-radius:6px;
  background:#f0f0f0;color:#888;
}
.car-status.ok{background:var(--green-pale);color:var(--green)}
.car-status.err{background:var(--red-pale);color:var(--red)}

/* ── 統計格 ── */
.stat-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;padding:.85rem;
}
.stat-box{
  background:#faf7f2;border-radius:12px;padding:.65rem .4rem;
  text-align:center;border:2px solid var(--border);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.02);
}
.stat-num{
  font-family:'Noto Serif TC',serif;
  font-size:2.2rem;font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.stat-lbl{font-size:.82rem;color:var(--gray);margin-top:.3rem;font-weight:700}
.num-green{color:var(--green)}
.num-red  {color:var(--red)}
.num-gray {color:var(--amber)}
.stat-num.loading{color:#ccc;font-size:1.6rem}

/* ── 合計區 ── */
.total-block{
  background:var(--white);
  border:2px solid var(--gold-border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(90,64,32,.09);
}
.total-hd{
  display:flex;align-items:center;gap:.5rem;
  padding:.7rem 1rem;
  background:linear-gradient(135deg,#fdf6e0,#fef9f0);
  border-bottom:1.5px solid var(--gold-border);
}
.total-name{
  font-family:'Noto Serif TC',serif;
  font-size:1rem;font-weight:900;color:var(--maroon);
}
.total-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;padding:.85rem;
}
.total-box{
  background:var(--gold-pale);border-radius:12px;padding:.65rem .4rem;
  text-align:center;border:2px solid var(--gold-border);
}
.total-num{
  font-family:'Noto Serif TC',serif;
  font-size:2.4rem;font-weight:900;line-height:1;
  letter-spacing:-.02em;
}
.total-lbl{font-size:.82rem;color:var(--gray);margin-top:.3rem;font-weight:700}

footer{
  text-align:center;padding:1rem 0 2rem;
  color:#bbb;font-size:.7rem;
}
</style>
</head>
<body>

<header>
  <div class="h-title">☸ 0524 浴佛法會<br>義工報到總覽</div>
  <div class="h-sub">即時數字 · 每 30 秒自動更新</div>
</header>

<div class="refresh-bar">
  <span>最後更新：<span class="refresh-time" id="lastTime">—</span></span>
  <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">
    <span class="spin">↻</span> 立即更新
  </button>
</div>

<main>
  <!-- 12車 -->
  <div class="car-block" id="block-12">
    <div class="car-hd">
      <span class="car-ic">🚌</span>
      <span class="car-name">第 12 車</span>
      <span class="car-status" id="status-12">載入中…</span>
    </div>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-num num-green loading" id="p12">—</div>
        <div class="stat-lbl">已報到</div>
      </div>
      <div class="stat-box">
        <div class="stat-num num-red loading" id="n12">—</div>
        <div class="stat-lbl">未到</div>
      </div>
      <div class="stat-box">
        <div class="stat-num num-gray loading" id="t12">—</div>
        <div class="stat-lbl">應到</div>
      </div>
    </div>
  </div>

  <!-- 13車 -->
  <div class="car-block" id="block-13">
    <div class="car-hd">
      <span class="car-ic">🚌</span>
      <span class="car-name">第 13 車</span>
      <span class="car-status" id="status-13">載入中…</span>
    </div>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-num num-green loading" id="p13">—</div>
        <div class="stat-lbl">已報到</div>
      </div>
      <div class="stat-box">
        <div class="stat-num num-red loading" id="n13">—</div>
        <div class="stat-lbl">未到</div>
      </div>
      <div class="stat-box">
        <div class="stat-num num-gray loading" id="t13">—</div>
        <div class="stat-lbl">應到</div>
      </div>
    </div>
  </div>

  <!-- 合計 -->
  <div class="total-block">
    <div class="total-hd">
      <span style="font-size:1.3rem">📊</span>
      <span class="total-name">兩車合計</span>
    </div>
    <div class="total-grid">
      <div class="total-box">
        <div class="total-num num-green" id="pAll">—</div>
        <div class="total-lbl">已報到</div>
      </div>
      <div class="total-box">
        <div class="total-num num-red" id="nAll">—</div>
        <div class="total-lbl">未到</div>
      </div>
      <div class="total-box">
        <div class="total-num num-gray" id="tAll">—</div>
        <div class="total-lbl">應到</div>
      </div>
    </div>
  </div>
</main>

<footer>AQE@2026 · 0524浴佛法會 報到總覽</footer>

<script>
const CARS = [
  {
    id: '12',
    api: 'https://script.google.com/macros/s/AKfycbz_i1spdxXnPJmx7tZUtIfBn9ybdrJdtaBNjjGaVBpViFrED01sFYWwIviiB3tH6yB3Fw/exec'
  },
  {
    id: '13',
    api: 'https://script.google.com/macros/s/AKfycbyr2TzUPjq3GYn-Z9bZCKpGIL3y1701MrlKfIZmnB_eAcK4Bph2XSMi3tWTO2NJFYi5/exec'
  },
];

// 最新數字快取
const cache = { '12': null, '13': null };

function nCode(r){ return String(r||'').padStart(3,'0'); }

function calcStats(r){
  const frozen   = (r.frozen||[]).map(c => nCode(c));
  const statuses = {};
  Object.entries(r.statuses||{}).forEach(([k,v]) => { statuses[nCode(k)] = v; });

  const active  = (r.students||[]).filter(s => !frozen.includes(nCode(s.code)));
  const present = active.filter(s => {
    const st = statuses[nCode(s.code)];
    return !!st && st.type === 'present';
  }).length;
  const total   = active.length;
  const pending = total - present;
  return { present, pending, total };
}

function setNums(id, stats){
  document.getElementById('p'+id).textContent = stats.present;
  document.getElementById('n'+id).textContent = stats.pending;
  document.getElementById('t'+id).textContent = stats.total;
  ['p','n','t'].forEach(p => document.getElementById(p+id).classList.remove('loading'));
}

function setStatus(id, ok, msg){
  const el = document.getElementById('status-'+id);
  el.textContent = msg;
  el.className = 'car-status ' + (ok ? 'ok' : 'err');
}

function updateTotal(){
  const all = Object.values(cache).filter(Boolean);
  if(all.length === 0) return;
  const sum = all.reduce((acc, s) => ({
    present: acc.present + s.present,
    pending: acc.pending + s.pending,
    total:   acc.total   + s.total,
  }), { present:0, pending:0, total:0 });
  document.getElementById('pAll').textContent = sum.present;
  document.getElementById('nAll').textContent = sum.pending;
  document.getElementById('tAll').textContent = sum.total;
}

async function fetchCar(car){
  try {
    const res = await fetch(car.api + '?action=getAll');
    const r   = await res.json();
    if(!r || !r.ok) throw new Error('bad response');
    const stats = calcStats(r);
    cache[car.id] = stats;
    setNums(car.id, stats);
    setStatus(car.id, true, '✓ 已同步');
  } catch(e){
    setStatus(car.id, false, '⚠ 連線失敗');
  }
}

function updateTime(){
  const now = new Date();
  const hh  = String(now.getHours()).padStart(2,'0');
  const mm  = String(now.getMinutes()).padStart(2,'0');
  const ss  = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('lastTime').textContent = `${hh}:${mm}:${ss}`;
}

async function refreshAll(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await Promise.all(CARS.map(fetchCar));
  updateTotal();
  updateTime();
  btn.classList.remove('spinning');
}

// 初始載入 + 每30秒自動更新
refreshAll();
setInterval(refreshAll, 30000);
</script>
</body>
</html>
